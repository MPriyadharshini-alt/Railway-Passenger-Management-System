services:
  - type: web
    name: railway-passenger-api
    runtime: node
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build:client
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false
